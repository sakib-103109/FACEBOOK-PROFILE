<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROFILE</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="facebook-profile">
        <div class="cover-photo">
          <img
            class="cover-image"
            src="https://images.unsplash.com/photo-1563748415118-f5214efd4bcf?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="COVER PHOTO"
          />
        </div>

        <div class="card">
          <div class="text-part">
            <h1>Sakib Hosain</h1>
            <h4>10M friends</h4>

            <div class="location-icon1">
              <i class="fa-solid fa-location-dot"></i>
              <h4>Sylhet</h4>
            </div>
          </div>
          <div class="pro-im-sta">
            <img
              class="profile-image"
              src="https://scontent.fdac31-1.fna.fbcdn.net/v/t39.30808-6/707435217_122171920142802277_9050085365543732066_n.jpg?stp=dst-jpg_tt6&cstp=mx2040x2048&ctp=s2040x2048&_nc_cat=108&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=NxFE0koHGVYQ7kNvwFmCCdn&_nc_oc=AdoPZZQKu_j5rZl4jM7d03j9oiXJUIzGdU9tjVZrZZlKN6vG-0rZ4YXBSS2j2YK_ELE&_nc_zt=23&_nc_ht=scontent.fdac31-1.fna&_nc_gid=OoWMRL-L7CyPxwvo-nxHcQ&_nc_ss=7b2a8&oh=00_AQTr56jp2Fv1TxRwdeAZRzNDUO9OWdn8GRbsTIcYW5irCA&oe=6AF24583"
              alt="PROFILE PHOTO"
            />

            <div class="online-status"></div>
          </div>
          <div class="btn">
            <button class="design-add">
              <i class="fa-solid fa-plus"></i> Add to story
            </button>
            <button class="design-edit">
              <i class="fa-solid fa-pencil"></i> Edit profile
            </button>
          </div>
          <div class="lock-profile">
            <div class="lock-icon"><i class="fa-solid fa-circle-user"></i></div>
            <div class="lock-text">
              <p>You locked your profile</p>
              <span class="learn"
                ><a class="learn-an" href="#">Learn more</a></span
              >
            </div>
          </div>
          <ul class="profile-list">
            <li><a href="#">All</a></li>
            <li><a href="#">Photo</a></li>
            <li><a href="#">Reels</a></li>
            <li><a href="#">Memories</a></li>
          </ul>
          <p class="per">Personal details</p>
          <div class="location-icon2">
            <i class="fa-solid fa-location-dot"></i>
            <h4>Sylhet</h4>
          </div>
          <div class="location-icon2">
            <i class="fa-solid fa-house"></i>
            <h4>Sylhet</h4>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
